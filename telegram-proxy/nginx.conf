# Reverse proxy to api.telegram.org, for servers that can't reach it directly.
# Cloudflare + Google public DNS; swap for your own resolver if needed.
resolver 1.1.1.1 8.8.8.8 valid=300s;

server {
    listen 80;
    server_name _;

    # getUpdates uses long polling (timeout up to 30s server-side); give it room.
    proxy_connect_timeout 10s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    location / {
        proxy_pass https://api.telegram.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
        proxy_http_version 1.1;
    }
}
